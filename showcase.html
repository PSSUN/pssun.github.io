---
layout: default
title : Showcase
navbar_title: Showcase
container_class: container-xl
---

<div style="min-height: calc(100vh - 200px); position: relative; z-index: 1;">
    <div class="row mb-4">
        <div class="p-2 col-md-8 col-sm-12 col-12">
            <div>
                <video controls class="w-100 rounded-xl">
                    <source src="{{ '/assets/images/etc/stminer.mp4' | relative_url }}" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="p-2 col-md-4 col-sm-6 col-6">
            <div class="card border-0 shadow-sm">
                {%- assign photo_card = site.showcase | where: "show", true | sort: "date" | reverse | first -%}
                {% include widgets/carousel.html id="showcase-photos" images=photo_card.images height=photo_card.height %}
            </div>
        </div>
    </div>
</div>
